# apiserver 的 KMS 凭证声明：从现有 bkpaas3 values 渲染信封，values 不需要改动
#
# - .Values.bk_paas 为 bkpaas3 release 的 values；取值逻辑与 bkpaas3 chart 渲染环境变量的逻辑一致
# - 只包含 apiserver 会读取的配置；值为空的配置项不写入，apiserver 保持原有配置来源
# - 通过 toJson 生成整个 JSON，值中含有引号、反斜杠、换行时也不会破坏格式
# - 对应 chart 配置：
#     apiserver.kms.role: default.scope.blueking.secret.bk_paas_apiserver_runtime_config
#     apiserver.kms.credential: default/scope/blueking/secret/bk_paas_apiserver_runtime_config
scope:
  type: scope
  name: blueking
  description: 蓝鲸服务凭证
  credentials:
    - type: secret
      name: bk_paas_apiserver_runtime_config
      aliasName: bk-paas-apiserver
      description: PaaS 平台 apiserver 敏感配置
      annotation: ""
      enableEncrypt: true
      value: |-
        {{- $v := .Values.bk_paas }}
        {{- $g := dig "global" (dict) $v }}
        {{- $api := dig "apiserver" (dict) $v }}
        {{- $out := dict }}

        {{- /* env：键为环境变量名，值与 chart 渲染出的环境变量一致 */}}
        {{- $env := dict }}
        {{- with dig "appSecret" "" $g }}{{ $_ := set $env "PAAS_BK_APP_SECRET" . }}{{ end }}
        {{- with dig "bkKrillEncryptSecretKey" "" $g }}{{ $_ := set $env "PAAS_BKKRILL_ENCRYPT_SECRET_KEY" . }}{{ end }}
        {{- with dig "paasServicesJwtClientKey" "" $g }}{{ $_ := set $env "PAAS_ONE_SIMPLE_JWT_AUTH_KEY" . }}{{ end }}
        {{- with dig "healthzToken" "" $g }}{{ $_ := set $env "PAAS_HEALTHZ_TOKEN" . }}{{ end }}
        {{- with dig "trace" "otlp" "token" "" $g }}{{ $_ := set $env "PAAS_OTEL_BK_DATA_TOKEN" . }}{{ end }}
        {{- with dig "sentryDsn" "" $api }}{{ $_ := set $env "PAAS_SENTRY_CONFIG" (printf "{dsn='%s'}" .) }}{{ end }}
        {{- /* 未配置时 chart 使用默认值 your-metric-user-token，此处保持一致；建议在 values 中设置为随机值 */}}
        {{- with dig "serviceMonitor" "userToken" "your-metric-user-token" $api }}{{ $_ := set $env "PAAS_METRIC_CLIENT_TOKEN_DICT" (printf "{bkmonitor='%s'}" .) }}{{ end }}
        {{- with dig "celeryBrokerUrl" "" $api }}{{ $_ := set $env "PAAS_CELERY_BROKER_URL" . }}{{ end }}
        {{- with dig "agentSandboxRouterAuthToken" "" $api }}{{ $_ := set $env "PAAS_WL_AGENT_SANDBOX_ROUTER_AUTH_TOKEN" . }}{{ end }}
        {{- /* chart 模板中写死的值，必须与 chart 保持一致，不能单独更换 */}}
        {{- $_ := set $env "PAAS_SLUG_ENCRYPT_SECRET_KEY" "hebdpx89Ea8Shlxywxps6wX6pxobpIyfded-Q0nww_R=" }}

        {{- /* ES：优先使用旧的 hosts 字符串，否则与 chart 一样渲染 hostConfig */}}
        {{- $esHosts := dig "elasticSearch" "hosts" "" $api }}
        {{- $esHostConfig := dig "elasticSearch" "hostConfig" (list) $api }}
        {{- if $esHosts }}
        {{- $_ := set $env "PAAS_ELASTICSEARCH_HOSTS" $esHosts }}
        {{- else if $esHostConfig }}
        {{- $_ := set $env "PAAS_ELASTICSEARCH_HOSTS" (printf "@json %s" (toJson $esHostConfig)) }}
        {{- end }}

        {{- /* 镜像仓库密码：未启用外部仓库时，chart 使用 bkrepo 账号 */}}
        {{- $bkrepo := dig "bkrepoConfig" (dict) $g }}
        {{- if dig "externalSmartAppConfig" "enabled" false $g }}
        {{- with dig "externalSmartAppConfig" "dockerPassword" "" $g }}
        {{- $_ := set $env "PAAS_SMART_DOCKER_PASSWORD" . }}
        {{- $_ := set $env "PAAS_APP_DOCKER_PASSWORD" . }}
        {{- end }}
        {{- else }}
        {{- with dig "bkpaas3Password" "" $bkrepo }}
        {{- $_ := set $env "PAAS_SMART_DOCKER_PASSWORD" . }}
        {{- $_ := set $env "PAAS_APP_DOCKER_PASSWORD" . }}
        {{- end }}
        {{- end }}

        {{- /* apiserver.env 中直接配置的敏感环境变量，优先级与 K8s 中 env 高于 envFrom 一致 */}}
        {{- $sensitiveEnvNames := list
              "PAAS_BK_APP_SECRET" "PAAS_BKKRILL_ENCRYPT_SECRET_KEY" "PAAS_SECRET_KEY" "PAAS_SLUG_ENCRYPT_SECRET_KEY"
              "PAAS_PAAS_LEGACY_DB_ENCRYPT_KEY" "PAAS_IAM_APP_SECRET" "PAAS_BKAUTH_TOKEN_SECRET_KEY"
              "PAAS_ONE_SIMPLE_JWT_AUTH_KEY" "PAAS_PAAS_SERVICE_JWT_CLIENTS" "PAAS_PAAS_ANALYSIS_JWT_CONF"
              "PAAS_HEALTHZ_TOKEN" "PAAS_METRIC_CLIENT_TOKEN_DICT" "PAAS_OTEL_BK_DATA_TOKEN" "PAAS_BK_AUDIT_DATA_TOKEN"
              "PAAS_SENTRY_CONFIG" "PAAS_CLI_AUTH_SECRET" "PAAS_BUILD_TOKEN_SIGNING_KEYS"
              "PAAS_FRONTEND_ENCRYPT_PRIVATE_KEY_BASE64" "PAAS_IWIKI_API_RIO_GW_TOKEN" "PAAS_MK_SEARCH_API_RIO_GW_TOKEN"
              "PAAS_MK_SEARCH_API_PRIVATE_TOKEN" "PAAS_AGENT_SANDBOX_RESIDENT_DAEMON_TOKEN"
              "PAAS_SMART_DOCKER_PASSWORD" "PAAS_APP_DOCKER_PASSWORD" "PAAS_BLOBSTORE_S3_SECRET_KEY"
              "PAAS_RGW_SECRET_ACCESS_KEY" "PAAS_SENTINEL_PASSWORD" "PAAS_CELERY_BROKER_SENTINEL_PASSWORD"
              "PAAS_CELERY_RESULT_BACKEND_SENTINEL_PASSWORD" "PAAS_DEFAULT_CACHE_CONFIG" "PAAS_PLUGIN_REPO_CONF"
              "PAAS_SERVICES_VENDOR_CONFIGS" "PAAS_PAAS_X_BK_DATA_DB_CONF" "PAAS_ELASTICSEARCH_HOSTS"
              "PAAS_CELERY_BROKER_URL" "PAAS_CELERY_RESULT_BACKEND" "PAAS_REDIS_URL"
              "PAAS_WL_AGENT_SANDBOX_ROUTER_AUTH_TOKEN" "PAAS_WL_PYTHON_BUILDPACK_PIP_INDEX_URL" }}
        {{- range dig "env" (list) $api }}
        {{- if and (has .name $sensitiveEnvNames) .value }}{{ $_ := set $env .name (toString .value) }}{{ end }}
        {{- end }}
        {{- $_ := set $out "env" $env }}

        {{- /* mysql：内置 MariaDB 时 default、workloads 共用 mariadb.auth */}}
        {{- $mysql := dict }}
        {{- if dig "mariadb" "enabled" true $v }}
        {{- $auth := dig "mariadb" "auth" (dict) $v }}
        {{- if dig "password" "" $auth }}
        {{- $_ := set $mysql "default" (dict "username" (dig "username" "" $auth) "password" $auth.password) }}
        {{- $_ := set $mysql "workloads" (dict "username" (dig "username" "" $auth) "password" $auth.password) }}
        {{- end }}
        {{- else }}
        {{- range $instance, $key := dict "default" "default" "workloads" "workloads" }}
        {{- $db := dig "externalDatabase" $key (dict) $api }}
        {{- if dig "password" "" $db }}{{ $_ := set $mysql $instance (dict "username" (dig "user" "" $db) "password" $db.password) }}{{ end }}
        {{- end }}
        {{- end }}
        {{- $consoleDB := dig "externalDatabase" "openPaaS" (dict) $api }}
        {{- if dig "password" "" $consoleDB }}
        {{- $_ := set $mysql "console" (dict "username" (dig "user" "" $consoleDB) "password" $consoleDB.password) }}
        {{- end }}
        {{- if $mysql }}{{ $_ := set $out "mysql" $mysql }}{{ end }}

        {{- /* redis：内置 Redis 时使用 redis.*，否则使用 apiserver.externalRedis.default.* */}}
        {{- $redisConf := dig "apiserver" "externalRedis" "default" (dict) $v }}
        {{- if dig "redis" "enabled" true $v }}{{ $redisConf = dig "redis" (dict) $v }}{{ end }}
        {{- $redis := dict }}
        {{- with dig "auth" "password" "" $redisConf }}{{ $_ := set $redis "default" (dict "password" .) }}{{ end }}
        {{- if dig "sentinel" "enabled" false $redisConf }}
        {{- with dig "sentinel" "password" "" $redisConf }}{{ $_ := set $redis "sentinel" (dict "password" .) }}{{ end }}
        {{- end }}
        {{- if $redis }}{{ $_ := set $out "redis" $redis }}{{ end }}

        {{- /* bkrepo：BLOBSTORE_BKREPO_CONFIG 中的账号密码 */}}
        {{- if dig "bkpaas3Password" "" $bkrepo }}
        {{- $_ := set $out "bkrepo" (dict "default" (dict "username" (dig "bkpaas3Username" "" $bkrepo) "password" $bkrepo.bkpaas3Password)) }}
        {{- end }}

        {{- toJson $out }}
      auth:
        serviceAccount:
          nameList:
            # apiserver 的 ServiceAccount，release 名为 bkpaas3 时为 bkpaas3-apiserver
            - "bkpaas3-apiserver"
          namespaceList:
            - "<NAMESPACE>"
