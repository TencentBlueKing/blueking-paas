# 租户初始化配置示例：python manage.py init_tenant_infras -f example.yaml [--dry-run=false] [--overwrite]
# 所有字符串都支持 ${ENV_NAME} 引用环境变量，密钥类字段建议使用该方式，避免明文写在文件中
tenant_id: bk2game

# 新建或更新的集群（集群归属于 tenant_id），字段与平台管理端「添加集群」表单一致
clusters:
  - name: bk2game-main
    description: bk2game 应用集群
    cluster_source: bcs  # bcs / native_k8s
    bcs_project_id: abcdef0123456789
    bcs_cluster_id: BCS-K8S-00000
    bk_biz_id: "100"
    api_address_type: bcs_gateway  # bcs_gateway / custom
    api_servers:
      - https://bcs-api.example.com/clusters/BCS-K8S-00000
    auth_type: token  # token / cert（cert 时需提供 base64 编码的 ca / cert / key）
    token: ${BK2GAME_CLUSTER_TOKEN}
    container_log_dir: /var/lib/docker/containers
    access_entry_ip: 10.0.0.1
    # 未启用日志平台方案时必填
    elastic_search_config:
      scheme: http
      host: es.example.com
      port: 9200
      username: elastic
      password: ${BK2GAME_ES_PASSWORD}
    # 非默认 / 运营租户必填
    app_image_registry:
      host: mirrors.example.com
      skip_tls_verify: false
      namespace: bkapps
      username: bkapps
      password: ${BK2GAME_REGISTRY_PASSWORD}
    # 以下为可选项
    available_tenant_ids: [bk2game]  # 默认为 [tenant_id]
    app_address_type: subdomain  # subpath / subdomain
    app_domains:
      - name: bk2game-apps.example.com
        https_enabled: true
    component_preferred_namespace: blueking
    component_image_registry: hub.bktencent.com
    feature_flags: {}
    node_selector: {}
    tolerations: []

# 已存在的集群，将 tenant_id 追加到其可用租户列表中
shared_clusters: []

# 集群分配策略，结构与平台管理端一致
cluster_allocation_policy:
  type: uniform  # uniform / rule_based
  allocation_policy:
    env_specific: false
    clusters: [bk2game-main]

# 增强服务，key 为服务名称；方案的 config 由对应服务自行校验
services:
  mysql:
    plans:
      - name: default
        description: 默认方案
        config:
          host: mysql.example.com
          port: 3306
          user: admin
          password: ${BK2GAME_MYSQL_PASSWORD}
    # 绑定策略可选，默认统一分配本次声明的所有可用方案；也可使用 env_plans: {stag: [...], prod: [...]}
    binding_policy:
      plans: [default]
  rabbitmq:
    plans:
      - name: default
        description: 默认方案
        config:
          host: rabbitmq.example.com
          port: 5672
          management_api: http://rabbitmq.example.com:15672
          admin: admin
          password: ${BK2GAME_RABBITMQ_PASSWORD}
  otel:
    plans:
      - name: default
        description: 默认方案
  bkrepo:
    plans:
      - name: default
        description: 默认方案
        config:
          endpoint_url: http://bkrepo.example.com
          username: bksaas-addons
          password: ${BK2GAME_BKREPO_PASSWORD}
          project: bksaas-addons
  redis:
    plans:
      - name: 0shared
        description: 共享实例
        # 资源池实例，以 credentials 中的 host:port 判断是否已存在
        # 每条实例记录只能分配一次，count 为同一实例的记录数（即可分配次数），重复执行时只补足缺少的数量
        pre_created_instances:
          - config: {}
            count: 20
            credentials:
              host: redis-0.example.com
              port: 6379
              password: ${BK2GAME_REDIS_0_PASSWORD}
      - name: 1exclusive
        description: 独占实例

# 租户日志配置（日志平台方案），可选
log_config:
  storage_cluster_id: 1
  retention: 14
  es_shards: 1
  storage_replicas: 1
  time_zone: 8
