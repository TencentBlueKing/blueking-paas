# e2b 沙箱模板声明文件示例。复制本文件并按实际环境修改后执行：
#   python manage.py e2b_sandbox_template apply -f <your_templates.yaml>
#
# 字段说明：
#   template_id    必填，与底层 e2b 网关的模板标识一致（即 SDK 创建沙箱时传入的 templateID）
#   name           必填，页面展示名称
#   description    模板说明，页面展示
#   image          镜像，仅供展示
#   cpu_count      CPU 核数，仅供展示，正整数
#   memory_mb      内存（MB），仅供展示，正整数
#   disk_size_mb   磁盘（MB），仅供展示，正整数
#   enabled        是否启用，默认 true；未启用的模板不能用于创建沙箱
#   is_public      是否公开，默认 false；不公开的模板不在开发者中心展示，但知道 template_id 仍可通过 SDK 使用
#
# 文件即所列模板的完整定义：未写的字段会回到默认值。资源字段以底层模板的实际规格为准，修改底层模板后需同步更新。

# 完整字段示例
- template_id: example-base
  name: 基础环境
  description: 通用的 Linux 沙箱环境，适合执行命令、读写文件等通用任务
  image: registry.example.com/sandbox/base:latest
  cpu_count: 2
  memory_mb: 4096
  disk_size_mb: 20480
  enabled: true
  is_public: true

# 最简示例：只填必填字段与常用展示字段
- template_id: example-python
  name: Python 代码执行
  description: 预置 Python 运行环境，适合运行 Agent 生成的代码片段
  cpu_count: 2
  memory_mb: 4096
  is_public: true

# 不公开示例：仅供特定服务通过 SDK 使用，不在开发者中心展示
- template_id: example-internal
  name: 内部服务专用
  description: 某服务自用的模板，不对外公开
  cpu_count: 2
  memory_mb: 4096
