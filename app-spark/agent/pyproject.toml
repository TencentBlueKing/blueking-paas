[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[project]
name = "app-spark-agent"
version = "0.1.0"
description = "Sandbox-side coding agent runtime for App-Spark natural-language SaaS development."
readme = "README.md"
authors = [{ name = "blueking", email = "blueking@tencent.com" }]
requires-python = ">=3.14"
dependencies = [
    "environs>=15.1.0,<16.0.0",
    "fastapi>=0.116.0",
    # Required by environs; declared explicitly because `settings.py` imports its validators
    # directly rather than through the untyped `environs.validate` alias.
    "marshmallow>=4.0.0,<5.0.0",
    "pydantic-ai-harness>=0.24.0,<1.0.0",
    "pydantic-ai-slim[ag-ui,openai]>=2.32.1,<3.0.0",
    "uvicorn>=0.52.1,<0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0,<3.0.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app_spark_agent"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.mypy]
python_version = "3.14"
show_error_codes = true
check_untyped_defs = true
files = ["app_spark_agent"]

[[tool.mypy.overrides]]
module = ["ag_ui", "ag_ui.*", "pydantic_ai_harness", "pydantic_ai_harness.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["e2e"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: exercises the real DeepSeek API",
]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Agent sources predate the root typing-only import / complexity rules.
extend-ignore = ["TC", "PLR0911"]

[tool.ruff.lint.isort]
known-first-party = ["app_spark_agent"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "TC", "SIM117", "ASYNC109", "PT013", "PT017"]
