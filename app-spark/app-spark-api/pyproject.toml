[project]
name = "app-spark-api"
version = "0.1.0"
description = "An AI-native app-building tool powered by the BlueKing PaaS platform and AI technology."
readme = "README.md"
authors = [{ name = "blueking", email = "blueking@tencent.com" }]
requires-python = ">=3.14"
dependencies = [
    "attrs>=26.1.0,<27.0.0",
    "bkpaas-auth>=4.4.0,<5.0.0",
    "blue-krill>=3.1.1,<4.0.0",
    "cattrs>=26.1.0,<27.0.0",
    "django>=6.0.8,<6.1",
    "django-ninja>=1.6.2,<2.0.0",
    "dynaconf>=3.3.5,<4.0.0",
    # Already installed as a transitive dependency of bkpaas-auth, declared here because this
    # project imports it directly to drive the Agent Runtime over HTTP.
    "httpx2>=2.10.0,<3.0.0",
    "pymysql>=1.2.0,<2.0.0",
    # Required by the production ASGI server, including the container image.
    "uvicorn>=0.52.1,<0.53.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]==6.0.9",
    "mypy>=2.3.0,<3.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-django>=4.14.0,<5.0.0",
    "ruff>=0.16.1,<0.17.0",
]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint.isort]
known-first-party = ["app_spark_api"]

[tool.ruff.lint.flake8-type-checking]
# pydantic 会在运行时解析这些基类的字段注解，把它们的 import 挪进 TYPE_CHECKING 块会直接让
# 模型构建失败，所以这里声明清楚，让 TC 规则不要对它们提出这种建议。
runtime-evaluated-base-classes = ["ninja.Schema", "pydantic.BaseModel"]

[tool.mypy]
python_version = "3.14"
show_error_codes = true
check_untyped_defs = true
files = ["app_spark_api", "manage.py"]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["dynaconf", "dynaconf.*", "pymysql"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "app_spark_api.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app_spark_api.settings"
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
