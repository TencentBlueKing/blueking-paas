add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 基础 CSP：入口配置和登录回调仍含内联脚本，Vue 组件也需要内联样式。
# 保留 unsafe-inline 兼容这些页面，但禁止内联事件处理、eval 和外部脚本。
# 预览探活及登录/预览 iframe 支持运行时配置的 HTTP(S) 地址。
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https:; frame-src 'self' http: https:; form-action 'self'" always;

# 当前工作室不使用这些设备能力；空白名单也会限制其嵌入的预览页面。
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
