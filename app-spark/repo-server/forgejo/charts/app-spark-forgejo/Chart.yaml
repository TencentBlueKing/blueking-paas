apiVersion: v2
name: app-spark-forgejo
description: App Spark repo-server (Forgejo) Git host
type: application
version: 0.1.0-alpha.2
# 部署的 Forgejo 版本，同时作为 image.tag 的默认值。升版本要同步改 Dockerfile 和 compose.yaml。
appVersion: "15.0.7"
# 1.18 才有 pathType 和 ingressClassName。再低的集群渲染不出现在这套 Ingress。
# 1.19 以下由 common chart 改用 networking.k8s.io/v1beta1，backend 也换成 serviceName/servicePort。
kubeVersion: ">=1.18.0-0"
dependencies:
  - name: common
    repository: https://charts.bitnami.com/bitnami
    version: 2.13.3
