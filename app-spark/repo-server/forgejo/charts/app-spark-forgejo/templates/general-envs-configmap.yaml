{{- include "app-spark-forgejo.validateValues" . }}
{{- $invariants := include "app-spark-forgejo.invariantConfig" . | fromYaml }}
{{- range $key, $_ := .Values.extraConfig }}
  {{- if hasKey $invariants $key }}
    {{- fail (printf "extraConfig 不能改写不变量 %s，理由见 repo-server/forgejo/compose.yaml。" $key) }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app-spark-forgejo.fullname" . }}
  labels:
    {{- include "app-spark-forgejo.labels" . | nindent 4 }}
data:
  # 镜像 entrypoint 用它把容器内的 git 用户对齐到卷上的文件属主。
  USER_UID: "1000"
  USER_GID: "1000"
  {{- range $key, $value := merge (deepCopy $invariants) .Values.extraConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
