{{/*
数据库密码和初始化账号密码。server 只取数据库密码，init Job 才需要账号密码，
所以 server 用 secretKeyRef 单点引用，而不是把整个 Secret envFrom 进去。
Forgejo 自己的 SECRET_KEY / INTERNAL_TOKEN 由首次启动生成并留在 /data，不在这里管理。
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app-spark-forgejo.fullname" . }}
  labels:
    {{- include "app-spark-forgejo.labels" . | nindent 4 }}
type: Opaque
stringData:
  FORGEJO__database__PASSWD: {{ .Values.database.password | quote }}
  {{- if .Values.init.enabled }}
  FORGEJO_ADMIN_PASSWORD: {{ .Values.auth.adminPassword | quote }}
  FORGEJO_SERVICE_ACCOUNT_PASSWORD: {{ .Values.auth.serviceAccountPassword | quote }}
  {{- end }}
