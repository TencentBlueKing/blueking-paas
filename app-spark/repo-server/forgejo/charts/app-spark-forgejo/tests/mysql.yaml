# Only for the isolated kind smoke test; these are disposable test credentials.
apiVersion: v1
kind: Namespace
metadata:
  name: app-spark-forgejo-helm-test
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: app-spark-forgejo-helm-test
spec:
  selector:
    app: forgejo-test-mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: app-spark-forgejo-helm-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-test-mysql
  template:
    metadata:
      labels:
        app: forgejo-test-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4.11
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: forgejo-test-root-only
            - name: MYSQL_DATABASE
              value: forgejo
            - name: MYSQL_USER
              value: forgejo
            - name: MYSQL_PASSWORD
              value: forgejo-test-only
          args:
            # 测试库只有几 MB。默认 redo log 是 100MB，没必要占这么多。
            - --innodb-redo-log-capacity=8388608
          ports:
            - containerPort: 3306
          readinessProbe:
            tcpSocket:
              port: 3306
            periodSeconds: 2
          # mysql 镜像把 /var/lib/mysql 声明成 VOLUME。这个路径必须挂载，否则运行时
          # 会另建匿名卷；容器删了卷还在。emptyDir 跟 Pod 一起没。
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          emptyDir: {}
